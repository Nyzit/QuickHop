name: QuickHop
version: 1.0.0
main: dev.codex.quickhop.QuickHopPlugin
api-version: '26.2'
description: Configure hopper transfer cooldown and items per transfer.
commands:
  hopperspeed:
    description: Set or view the hopper transfer cooldown in ticks.
    usage: /hopperspeed [ticks]
    permission: quickhop.admin
  hoppertick:
    description: Set or view how many items a hopper moves per transfer.
    usage: /hoppertick [amount]
    permission: quickhop.admin
permissions:
  quickhop.admin:
    description: Allows changing hopper transfer settings.
    default: op
